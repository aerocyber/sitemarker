# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json

name: "sitemarker"
arch: "amd64"
platform: "linux"
version: "${APP_VERSION}"
version_schema: "semver"
section: "utils"
priority: "optional"
maintainer: "Aero <aerocyber@users.noreply.github.com>"

description: |
  A cross-platform, offline-first bookmark management application 
  built with Flutter and Drift. Keep your digital references organized, 
  secure, and accessible across Linux, Windows, Web, and Android.
vendor: "Aero"
homepage: "https://github.com/aerocyber/sitemarker"
license: "Apache-2.0"

contents:
  - dst: /usr/lib/sitemarker
    src: "sitemarker/build/linux/x64/release/bundle"
    type: tree
    file_info:
      mode: 0755

  - dst: /usr/bin/sitemarker
    src: /usr/lib/sitemarker/sitemarker
    type: symlink

  - dst: /usr/share/applications/io.github.aerocyber.sitemarker.desktop
    src: "packaging/linux/flatpak/flatpak/io.github.aerocyber.sitemarker.desktop"
    file_info:
      mode: 0644
  
  - dst: /usr/share/metainfo/io.github.aerocyber.sitemarker.appdata.xml
    src: "packaging/linux/flatpak/flatpak/io.github.aerocyber.sitemarker.appdata.xml"
    file_info:
      mode: 0644

  - dst: /usr/share/icons/hicolor/512x512/apps/sitemarker.png
    src: "sitemarker/windows/runner/resources/app_icon.png"
    file_info:
      mode: 0644
