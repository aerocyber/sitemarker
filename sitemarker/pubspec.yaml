name: sitemarker
description: "An open source bookmark manager."

publish_to: 'none'

version: 3.1.2+2011 # TODO: Update version number before release. Don't forget to bump the build number as well.

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.1
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.3.4
  provider: ^6.1.1
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.20
  logger: ^2.1.0
  sqlite3: ^2.9.4
  http: ^1.2.2
  package_info_plus: ^9.0.0
  validators: ^3.0.0
  intl: ^0.20.1
  drift_flutter: ^0.2.2
  html: ^0.15.5
  receive_sharing_intent: ^1.8.1
  toastification: ^3.0.2
  crypto: ^3.0.6
  permission_handler: ^12.0.1
  file_saver: ^0.3.1
  file_picker: ^10.2.0
  docman: ^1.2.0
  device_info_plus: ^12.3.0
  pub_semver: ^2.2.0
  rxdart: ^0.28.0
  universal_io: ^2.3.1
  go_router: ^17.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  drift_dev: ^2.22.1
  test: ^1.26.3
  msix: ^3.16.9
  custom_lint: ^0.8.1

flutter:
  uses-material-design: true

  assets:
    # - assets/themes/
    - assets/io.github.aerocyber.sitemarker.png
