# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

---
app-id: io.github.aerocyber.sitemarker
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: sitemarker
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=xdg-documents:create
  - --filesystem=xdg-data:create
modules:
  - name: Sitemarker
    buildsystem: simple
    sources:
      - type: archive
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz # TODO: Update flutter download URL
        sha256: 2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb # TODO: Update flutter tar.xz SHA256 checksum
        dest-filename: flutter_sdk.tar.xz
        strip-components: 0
        dest: flutter_dir

      - type: git
        url: https://github.com/aerocyber/sitemarker.git
        tag: 4.0.0
    
    build-commands:
      - export PATH="$PWD/flutter_dir/flutter/bin:$PATH"

      - cd sitemarker && flutter config --no-analytics && flutter build linux --release --offline
      - install -D sitemarker/build/linux/*/release/bundle/sitemarker /app/bin/sitemarker
      - cp -r sitemarker/build/linux/*/release/bundle/* /app/bin/

      - install -Dm644 packaging/linux/flatpak/flatpak/io.github.aerocyber.sitemarker.desktop -t /app/share/applications/
      - install -Dm644 packaging/linux/flatpak/flatpak/io.github.aerocyber.sitemarker.appdata.xml -t /app/share/metainfo/
      - install -Dm644 packaging/linux/flatpak/flatpak/icons/hicolor/scalable/apps/io.github.aerocyber.sitemarker.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 packaging/linux/flatpak/flatpak/icons/hicolor/symbolic/apps/io.github.aerocyber.sitemarker.svg -t /app/share/icons/hicolor/symbolic/apps/