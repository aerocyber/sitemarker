name: sitemarker
version: 4.0.0
summary: "A fast, open source bookmark manager made for YOU"
description: |
  Sitemarker is a local-first bookmark manager that actually gets out of your way. Version 4.0 was rebuilt from the ground up to give you total control over your links without forcing you into an account or cloud subscription.

  Whether you are organizing deep research, saving technical documentation, or just hoarding URLs, everything stays neatly categorized and strictly on your own device.

  What is inside 4.0:

    • Infinite Folders: Put folders inside folders inside folders. Build a directory tree that actually matches how your brain works.
    • Tags & Search: Attach custom tags to links and quickly find what you need with keyword filtering.
    • Clean UI: A snappy interface that respects your system's light and dark modes without cluttering the screen.
    • A Safety Net: The built-in Recycle Bin prevents accidental clicks from permanently wiping out your links.

  It is completely free, entirely open-source, and strictly local.

title: Sitemarker
license: Apache-2.0

contact: https://github.com/aerocyber/sitemarker/issues
issues: https://github.com/aerocyber/sitemarker/issues
source-code: https://github.com/aerocyber/sitemarker
website: https://aerocyber.github.io/sitemarker

confinement: strict

base: core24

platforms:
  amd64:
  arm64:

grade: devel

# slots:
#  dbus-sitemarker:
#    interface: dbus
#    bus: session
#    name: io.github.aerocyber.sitemarker

apps:
  sitemarker:
    command: sitemarker
    extensions: [gnome]
    plugs:
      - network
      - home
  #   slots:
  #     - dbus-sitemarker

parts:
  sitemarker:
    source: ./sitemarker
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - curl
      - git
      - unzip
      - xz-utils
      - zip
      - libglu1-mesa
      - clang
      - make
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
      - libstdc++-12-dev
      - libsqlite3-dev
    stage-packages:
      - libsqlite3-0
